# The realm's PostgreSQL: WAL archiving for point-in-time restore.
# Install as /etc/postgresql/18/main/conf.d/realm-archive.conf and restart
# PostgreSQL once (archive_mode needs a restart). Base backups come from
# realm-backup (realm-backup.timer); see deploy/README.md.
wal_level = replica
archive_mode = on
archive_command = '/opt/realm/bin/realm-wal-archive %p %f'
# A quiet realm still archives at least once a minute: at most a minute of
# saves can be lost with the disk.
archive_timeout = 60
