name: ci

# Every push to main and every pull request: format, lint, build on the three
# client platforms, prove the QUIC transport (server selfcheck) and the
# GDExtension loading in the pinned Godot (client smoke), then check that the
# movement rules give bit-identical results on every platform (simcheck
# fingerprints compared in one job). GitHub-hosted runners only; the
# game box's self-hosted runner stays reserved for the live game's releases.

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: '4.7.2'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            godot_zip: linux.x86_64.zip
            godot_bin: Godot_v4.7.2-stable_linux.x86_64
            ext: librealm_client.so
          - os: windows-2025-vs2026
            godot_zip: win64.exe.zip
            godot_bin: Godot_v4.7.2-stable_win64_console.exe
            ext: realm_client.dll
          - os: macos-26
            godot_zip: macos.universal.zip
            godot_bin: Godot.app/Contents/MacOS/Godot
            ext: librealm_client.dylib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        if: matrix.os == 'ubuntu-26.04'
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: QUIC transport selfcheck
        run: cargo run --release -p realm_server -- selfcheck

      - name: Godot extension smoke
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_${{ matrix.godot_zip }}"
          unzip -q godot.zip -d godot
          mkdir -p tools/gdext_smoke/bin
          cp "target/release/${{ matrix.ext }}" tools/gdext_smoke/bin/
          godot="godot/${{ matrix.godot_bin }}"
          chmod +x "$godot" || true
          "$godot" --headless --path tools/gdext_smoke --import > /dev/null 2>&1 || true
          proto=$(grep -oE 'PROTOCOL_VERSION: u16 = [0-9]+' crates/realm_proto/src/lib.rs | grep -oE '[0-9]+$')
          hz=$(grep -oE 'SIM_HZ: u32 = [0-9]+' crates/realm_sim/src/lib.rs | grep -oE '[0-9]+$')
          "$godot" --headless --path tools/gdext_smoke -s res://smoke.gd -- "$proto" "$hz"

      - name: Movement fingerprint
        run: cargo run --release -p realm_simcheck | tee "simcheck-${{ matrix.os }}.txt"

      - name: Content check
        # References, leftover franchise names, and the content hash (appended
        # to the fingerprint, so every platform must agree on it too).
        run: cargo run --release -p realm_content -- check content/rename_map.toml content/data | tee -a "simcheck-${{ matrix.os }}.txt"

      - name: No franchise-derived names left
        if: matrix.os == 'ubuntu-26.04'
        run: cargo run --release -p realm_content -- scan content/rename_map.toml game crates content/data tools README.md

      - name: Map packs check
        # Every map: bodies rest on ground from each spawn point and keep to
        # the map's height band walking four ways; random navigation paths
        # exist and never leave the mesh.
        run: cargo run --release -p realm_worldc -- check world/maps content/data

      - name: Server and bots end to end
        if: matrix.os == 'ubuntu-26.04'
        # The real join path (signed ticket, QUIC, snapshots against acked
        # baselines) with 20 fighting bots; the bots fail the step unless all
        # join and every snapshot decodes.
        run: |
          ./target/release/realm_server keygen keys
          ./target/release/realm_server serve --bind 127.0.0.1:7777 --dev-spawn-near-packs > server.log 2>&1 &
          sleep 2
          ./target/release/realm_bots --count 20 --seconds 15 --ramp 20
          kill %1 || true
          grep -v '^\[net\]' server.log | tail -3

      - name: Prediction under latency and loss
        if: matrix.os == 'ubuntu-26.04'
        # Phase 4 exit: the client's own motion never snaps back at 200 ms
        # round trip and 2% loss, on the castle (stairs, floors) map. The
        # check fails on any correction.
        run: |
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7777 > server.log 2>&1 &
          ./target/release/realm_netem --listen 127.0.0.1:7800 --server 127.0.0.1:7777 --delay-ms 100 --jitter-ms 20 --loss 0.02 &
          sleep 2
          ./target/release/realm_netcheck --server 127.0.0.1:7800 --map castle_interior --seconds 30
          kill %1 %2 || true

      - name: Chat and parties across maps
        if: matrix.os == 'ubuntu-26.04'
        # Two map servers linked by the coordinator: an invitation, a party
        # spanning both maps, a party line, a shout, a plain line that stays
        # on its map, a leave.
        run: |
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 > server_a.log 2>&1 &
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7778 --coord 127.0.0.1:7900 > server_b.log 2>&1 &
          sleep 4
          ./target/release/realm_netcheck --social
          kill %1 %2 %3 || true

      - name: Travel between maps
        if: matrix.os == 'ubuntu-26.04'
        # Two map servers and the coordinator sharing one character store: a
        # door each way, a hearth refused by level, a hearth on one map and to
        # the other, the broom (mount, climb, no landing in the air, get off),
        # a Waylink, and a second login taking the character from the castle.
        # The sheet must arrive whole every time, the prediction never
        # corrected.
        run: |
          mkdir -p build/travelcheck
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --characters build/travelcheck > server_a.log 2>&1 &
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7778 --coord 127.0.0.1:7900 --characters build/travelcheck > server_b.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --travel --characters build/travelcheck
          kill %1 %2 %3 || true

      - name: A dungeon run
        if: matrix.os == 'ubuntu-26.04'
        # The grounds and the Trial Hall (its creatures one hit each) with the
        # coordinator: the gate's rules, a solo Normal launch into a copy,
        # gather, countdown, every gate opening behind its creatures, the
        # Warden, a medal, the rewards and the character's own chest, the
        # clear recorded, out by the reward exit, Hard unlocked; no
        # correction.
        run: |
          mkdir -p build/dungeoncheck
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --characters build/dungeoncheck > server_a.log 2>&1 &
          ./target/release/realm_server serve --map dng_trial --bind 127.0.0.1:7779 --coord 127.0.0.1:7900 --characters build/dungeoncheck --dev-dungeon-scale 0.05 > server_d.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --dungeon --characters build/dungeoncheck
          # Run it again from the finished copy: a fresh copy on the same map.
          ./target/release/realm_netcheck --dungeon --replay --characters build/dungeoncheck
          kill %1 %2 %3 || true

      - name: A dungeon run under every curse
        if: matrix.os == 'ubuntu-26.04'
        # The quick run (launch to the second gate) with all eight weekly
        # curses forced: their marks must reach the player, the prediction
        # never corrected.
        run: |
          mkdir -p build/cursecheck
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --characters build/cursecheck > server_a.log 2>&1 &
          ./target/release/realm_server serve --map dng_trial --bind 127.0.0.1:7779 --coord 127.0.0.1:7900 --characters build/cursecheck --dev-dungeon-scale 0.05 --dev-dungeon-affixes burst,storm,sticky,bolster,enrage,chill,teeming,bleed > server_d.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --dungeon --quick --characters build/cursecheck
          kill %1 %2 %3 || true

      - name: The Sealed Wing's multi-part bosses
        if: matrix.os == 'ubuntu-26.04'
        # Runs started at the boss (--dev-dungeon-start): the stair breath
        # pushes, the sleep chime puts Threehead to sleep, its heads fall one
        # by one and the body with the last; the Strangling Vine's heart is
        # untouchable until its vines are gone. No correction.
        run: |
          mkdir -p build/bosscheck
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7778 --coord 127.0.0.1:7900 --characters build/bosscheck > server_c.log 2>&1 &
          ./target/release/realm_server serve --map dng_sealed_wing --bind 127.0.0.1:7780 --coord 127.0.0.1:7900 --characters build/bosscheck --dev-dungeon-scale 0.05 --dev-dungeon-start threehead > server_w.log 2>&1 &
          WING=$!
          sleep 8
          ./target/release/realm_netcheck --boss threehead --server 127.0.0.1:7778 --characters build/bosscheck
          kill $WING || true
          sleep 2
          ./target/release/realm_server serve --map dng_sealed_wing --bind 127.0.0.1:7780 --coord 127.0.0.1:7900 --characters build/bosscheck --dev-dungeon-scale 0.05 --dev-dungeon-start snare > server_w2.log 2>&1 &
          sleep 6
          ./target/release/realm_netcheck --boss snare --server 127.0.0.1:7778 --characters build/bosscheck
          kill %1 %2 %4 || true

      - name: The Web Mother's Lair
        if: matrix.os == 'ubuntu-26.04'
        # Runs started at the step (--dev-dungeon-start): egg sacs left alone
        # hatch into weavers and the brood must fall before the gate parts;
        # the Web Mother spins the lone player into a cocoon
        # (--dev-cocoon-solo), wells up venom pools and falls. No death, no
        # correction.
        run: |
          mkdir -p build/laircheck
          ./target/release/realm_coord > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map spider_caverns --bind 127.0.0.1:7781 --coord 127.0.0.1:7900 --characters build/laircheck > server_s.log 2>&1 &
          ./target/release/realm_server serve --map dng_spider_lair --bind 127.0.0.1:7782 --coord 127.0.0.1:7900 --characters build/laircheck --dev-dungeon-scale 0.05 --dev-dungeon-start eggs --dev-cocoon-solo > server_l.log 2>&1 &
          LAIR=$!
          sleep 8
          ./target/release/realm_netcheck --lair eggs --server 127.0.0.1:7781 --characters build/laircheck
          kill $LAIR || true
          sleep 2
          ./target/release/realm_server serve --map dng_spider_lair --bind 127.0.0.1:7782 --coord 127.0.0.1:7900 --characters build/laircheck --dev-dungeon-scale 0.05 --dev-dungeon-start queen --dev-cocoon-solo > server_l2.log 2>&1 &
          sleep 6
          ./target/release/realm_netcheck --lair queen --server 127.0.0.1:7781 --characters build/laircheck
          kill %1 %2 %4 || true

      - name: The realm's maintenance
        if: matrix.os == 'ubuntu-26.04'
        # The admin surface (token only), a lone save barrier, update_soon,
        # a countdown that refuses logins and is aborted, a store that fails
        # (the FAILED hold: everyone connected, the world frozen; aborted, the
        # save lands on retry) and the full cycle to MAINTENANCE with every
        # player told, saved where they stood and let go.
        run: |
          mkdir -p build/maintcheck
          REALM_SERVICE_TOKEN=check-token ./target/release/realm_coord --admin 127.0.0.1:8093 --drain-seconds 1 --save-min-ms 500 --announce-ms 1000 > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --characters build/maintcheck --dev-fail-saves build/maintcheck/FAIL_SAVES > server_g.log 2>&1 &
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7778 --coord 127.0.0.1:7900 --characters build/maintcheck --dev-fail-saves build/maintcheck/FAIL_SAVES > server_c.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --maintenance --admin 127.0.0.1:8093 --token check-token --grounds 127.0.0.1:7777 --castle 127.0.0.1:7778 --characters build/maintcheck
          kill %1 %2 %3 || true

      - name: Game admins and the weather
        if: matrix.os == 'ubuntu-26.04'
        # /ga refused to a player who is no GA; the admin surface makes one
        # (the emblem reaches the players beside it); its rain reaches both
        # maps and a later login; it makes another GA in game, who lists them
        # and stops the rain; taken back, refused again; the list is kept. A
        # new look and gear reach the others unasked; a world boss rising on
        # the grounds (--dev-boss-respawn) is heard in the castle too.
        run: |
          mkdir -p build/gacheck
          REALM_SERVICE_TOKEN=check-token ./target/release/realm_coord --admin 127.0.0.1:8093 --ga build/gacheck/ga.json > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --dev-boss-respawn 45 > server_g.log 2>&1 &
          ./target/release/realm_server serve --map castle_interior --bind 127.0.0.1:7778 --coord 127.0.0.1:7900 > server_c.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --ga --admin 127.0.0.1:8093 --token check-token --grounds 127.0.0.1:7777 --castle 127.0.0.1:7778 --ga-file build/gacheck/ga.json
          kill %1 %2 %3 || true

      - name: Login service
        if: matrix.os == 'ubuntu-26.04'
        # Account and character rules (names whatever the case, houses, two
        # per account), sessions, a play ticket that joins the grounds as the
        # character made, logout and the failed-login wait.
        run: |
          mkdir -p build/logincheck
          REALM_SERVICE_TOKEN=check-token ./target/release/realm_coord --admin 127.0.0.1:8093 > coord.log 2>&1 &
          sleep 1
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --coord 127.0.0.1:7900 --characters build/logincheck > server_g.log 2>&1 &
          REALM_SERVICE_TOKEN=check-token ./target/release/realm_login --coord-admin 127.0.0.1:8093 --characters build/logincheck > login.log 2>&1 &
          sleep 8
          ./target/release/realm_netcheck --login --login-addr 127.0.0.1:7950
          kill %1 %2 %3 || true

      - name: Characters in PostgreSQL (realm_persist)
        if: matrix.os == 'ubuntu-26.04'
        # A character saved through the persistence service lands in
        # PostgreSQL, comes back where it left after the map server restarts,
        # and an older sheet is refused (stale).
        run: |
          docker run -d --name realm-pg -p 127.0.0.1:55432:5432 -e POSTGRES_USER=realm -e POSTGRES_PASSWORD=realm-dev -e POSTGRES_DB=realm postgres:18.7
          for i in $(seq 1 30); do docker exec realm-pg pg_isready -U realm -d realm && break; sleep 1; done
          mkdir -p build/persistcheck
          export REALM_DATABASE_URL=postgres://realm:realm-dev@127.0.0.1:55432/realm
          ./target/release/realm_persist --bind 127.0.0.1:7970 > persist.log 2>&1 &
          sleep 2
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --persist 127.0.0.1:7970 > server_g.log 2>&1 &
          GROUNDS=$!
          sleep 7
          ./target/release/realm_netcheck --persist --persist-addr 127.0.0.1:7970 --server 127.0.0.1:7777 --restarted build/persistcheck/restarted &
          CHECK=$!
          while [ ! -f build/persistcheck/restarted.wanted ] && kill -0 $CHECK 2>/dev/null; do sleep 0.3; done
          kill $GROUNDS || true
          sleep 2
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 --persist 127.0.0.1:7970 > server_g2.log 2>&1 &
          sleep 7
          touch build/persistcheck/restarted
          wait $CHECK
          kill %1 %3 || true
          docker rm -f realm-pg

      - name: Duel to one health
        if: matrix.os == 'ubuntu-26.04'
        # A challenge, an accept, the countdown, a fight that ends with the
        # beaten duelist on 1 health and the result told to both.
        run: |
          ./target/release/realm_server serve --map grounds --bind 127.0.0.1:7777 > server.log 2>&1 &
          sleep 2
          ./target/release/realm_netcheck --duel
          kill %1 || true

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: simcheck-${{ matrix.os }}
          path: simcheck-${{ matrix.os }}.txt

  # The rules must give bit-identical results everywhere the game ships
  # (x86_64 Windows and Linux, ARM macOS). Any differing line fails the run.
  movement-agreement:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: simcheck-*
          merge-multiple: true
      - name: Compare fingerprints
        run: |
          ls simcheck-*.txt
          first=$(ls simcheck-*.txt | head -1)
          status=0
          for f in simcheck-*.txt; do
            if ! diff -u "$first" "$f"; then status=1; fi
          done
          if [ $status -eq 0 ]; then echo "all platforms agree: $(tail -1 "$first")"; fi
          exit $status
