# The latest release on an Apple Silicon Mac (GitHub-hosted macos-15, Metal),
# windowed: the published launcher installs it, the game logs in to the live
# realm with the CI smoke account (secrets REALM_MAC_SMOKE_USER/PASS; the first
# run registers it), picks or makes its character and must reach the world
# (--check-play). The client log is printed and kept as an artifact, with the
# game's own stall reports. It shows that loading goes on and how long the
# compiler takes on this machine; it proves nothing about what is drawn: the
# runner's virtual GPU is not a real Apple GPU, and Godot 4.8 renders unreliably
# on macOS virtual machines (godot#124859).
# Manual: gh workflow run mac-world-check.yml
name: mac-world-check

on:
  workflow_dispatch:
    inputs:
      engine_args:
        description: 'Extra engine arguments before -- (e.g. --rendering-method forward_plus)'
        type: string
        required: false
        default: ''
      game_args:
        description: 'Extra game arguments after -- (e.g. --no-shader-warmup)'
        type: string
        required: false
        default: ''
      runs:
        description: 'Starts in a row (shader caches stay between them)'
        type: string
        required: false
        default: '3'
      limit:
        description: 'Seconds one start may take (a cold start compiles for minutes)'
        type: string
        required: false
        default: '900'

permissions:
  contents: read

jobs:
  world:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Install the latest release and enter the world (Metal)
        env:
          SMOKE_USER: ${{ secrets.REALM_MAC_SMOKE_USER }}
          SMOKE_PASS: ${{ secrets.REALM_MAC_SMOKE_PASS }}
        run: |
          set -eu
          base="https://github.com/${{ github.repository }}/releases/latest/download"
          work="$RUNNER_TEMP/tr"
          mkdir -p "$work" && cd "$work"
          curl -fsSL -o launcher.zip "$base/ThousandRealms_Launcher-macos.zip"
          ditto -x -k launcher.zip .
          bin="$work/Thousand Realms Launcher.app/Contents/MacOS/ThousandRealms_Launcher"
          "$bin" --install-root "$work/install" --user-dir "$work/install/user" --update | tee update.json
          grep -q '"ok":true' update.json
          game="$(ls -d "$work"/install/versions/*/"Thousand Realms.app/Contents/MacOS/Thousand Realms")"
          chmod +x "$game"   # the launcher sets it when it starts the game
          sysctl -n machdep.cpu.brand_string; sw_vers
          # Windowed (Metal), native arm64, --verbose, started several times in a
          # row: the shader caches stay, so each start shows how far they carry
          # it. Once the shader warm-up begins (or after 60 s) the game's and
          # Apple's Metal compiler's CPU use and a native stack sample are kept:
          # a lock shows idle threads, a slow compile a busy MTLCompilerService.
          # A pty keeps output line-buffered.
          procs() { ps -Ao pid,pcpu,etime,comm | grep -E "MTLCompiler|Thousand Realms" | grep -v grep || true; }
          set +e
          for n in $(seq 1 ${{ inputs.runs }}); do
            log="$work/play_$n.log"
            : > "$log"
            ( script -q "$log" perl -e 'alarm shift; exec @ARGV' "$(( ${{ inputs.limit }} + 60 ))" arch -arm64 "$game" --verbose ${{ inputs.engine_args }} -- --check-play "$SMOKE_USER" "$SMOKE_PASS" --check-play-limit "${{ inputs.limit }}" ${{ inputs.game_args }} ) &
            job=$!
            for t in $(seq 1 60); do
              grep -q "ShaderWarmup\] started" "$log" && break
              kill -0 $job 2>/dev/null || break
              sleep 1
            done
            sleep 4
            pid="$(pgrep -x "Thousand Realms" | head -1)"
            { echo "run $n, game pid ${pid:-none}"; procs; } > "$work/procs_$n.txt"
            if [ -n "$pid" ]; then
              sample "$pid" 5 -file "$work/sample_$n.txt" >/dev/null 2>&1
              { echo "after the sample"; procs; } >> "$work/procs_$n.txt"
            fi
            wait $job
            tr -d '\r' < "$log" > "$work/play_clean_$n.log"
            echo "=== run $n"; cat "$work/procs_$n.txt"
            grep -E "Metal [0-9]|ShaderWarmup|grounds\] built|joined grounds|realm check play|realm watch" "$work/play_clean_$n.log" | cut -c1-200
            grep -c "Failed to compile Metal library" "$work/play_clean_$n.log"
          done
          set -e
          ud="$HOME/Library/Application Support/ThousandRealms/logs"
          cp "$ud/godot.log" "$work/godot.log" 2>/dev/null || true
          cp "$ud/stall_reports.jsonl" "$ud/stall_sample.txt" "$work/" 2>/dev/null || true
          grep -q "realm check play: PASS" "$work/play_clean_${{ inputs.runs }}.log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-world-logs
          path: |
            ${{ runner.temp }}/tr/play_clean_*.log
            ${{ runner.temp }}/tr/procs_*.txt
            ${{ runner.temp }}/tr/sample_*.txt
            ${{ runner.temp }}/tr/godot.log
            ${{ runner.temp }}/tr/stall_reports.jsonl
            ${{ runner.temp }}/tr/stall_sample.txt
          if-no-files-found: ignore
          retention-days: 7
