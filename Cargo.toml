[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
realm_sim = { path = "crates/realm_sim" }
realm_proto = { path = "crates/realm_proto" }
realm_data = { path = "crates/realm_data" }
realm_netclient = { path = "crates/realm_netclient" }
realm_rules = { path = "crates/realm_rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1"
sha2 = "0.11.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.4.3", features = ["std"] }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.17"
postcard = { version = "1.1.3", features = ["use-std"] }
zstd = { version = "0.14.4", default-features = false }
rerecast = "0.5.1"
glam = "0.33.12"
godot = { version = "0.5.5", features = ["api-4-7"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
