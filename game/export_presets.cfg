[preset.2.options]

; Universal (native on Apple Silicon, where Godot draws with Metal, and on
; Intel Macs); librealm_client.dylib must then be universal too (lipo).
; Godot refuses universal unless project.godot imports ETC2/ASTC as well, but
; the pck carries only the S3TC/BPTC textures, which Apple Silicon samples
; natively. Ad-hoc signed by Godot's built-in signer (no Apple Developer
; certificate, no notarization: the launcher downloads the game itself, so it
; never carries a quarantine flag); stage_client.sh signs the bundle again
; after it adds the release root's files to Contents/Resources.
export/distribution_type=1
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
application/icon="res://assets/branding/thousand_realms_icon.png"
application/bundle_identifier="com.thousandrealms.game"
application/signature=""
application/app_category="Games"
application/short_version="1.0"
application/version="1.0"
application/copyright=""
application/min_macos_version_x86_64="11.00"
application/min_macos_version_arm64="13.00"
display/high_res=true
codesign/codesign=1
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
