; Thousand Realms release export presets (Windows, Linux, macOS). The release
; workflow calls them by these names; README.md "Releasing the client" has the
; whole flow (build the extension, export, tools/release/stage_client.sh).
;
; Deliberate choices:
;   * binary_format/embed_pck=false -> ThousandRealms.exe/.x86_64 + ThousandRealms.pck,
;     so a launcher can check and patch files one by one;
;   * the GDExtension libraries (realm.gdextension: the realm_client library
;     from ../target/release; Terrain3D's from addons/terrain_3d/bin) are
;     copied beside the executable (macOS: Contents/Frameworks) by the export;
;   * the files the Rust core reads with std::fs (content/data, world/maps,
;     keys/tls.crt.der) are not in the pck: stage_client.sh puts them in the
;     release root after the export (RealmPaths.root());
;   * include_filter keeps the non-resource files the game reads with
;     FileAccess (Godot drops them otherwise): the grounds' scatter instances
;     (no trees, no trunk colliders without them), the far tree band's tiles,
;     the notices and lists the credits show;
;   * exclude_filter leaves the dev checks out (they need dev keys and dev
;     servers; main.gd refuses their switches in an exported game) and the
;     map_solids tool; scripts/systems/play_smoke.gd (--check-play) stays in;
;   * debug/export_console_wrapper=0 -> one executable in the package.
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/terrain/grounds/scatter/*.bin, assets/terrain/vegetation/*.bin, assets/fonts/OFL-Literata.txt, assets/fonts/OFL-Pretendard.txt, assets/credits/*.txt, assets/credits/*.json"
exclude_filter="scripts/systems/*_check.gd, maps/*/*_check.gd, maps/dng_common/map_solids.gd"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon="res://assets/branding/thousand_realms_icon.png"
application/console_wrapper_icon=""
