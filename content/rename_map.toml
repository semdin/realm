# Old game id -> realm id. The Phase 1 content converter passes every id it
# copies from the old game through this map, so no franchise-derived name
# reaches the new code, data, database or protocol. Player-visible names were
# already replaced on 2026-11-08 (Kaf name bible); this map finishes the job
# for the internal ids that were left as they were then.
#
# New ids are the snake_case form of the approved English display name.
# `token` replaces whole `_`-separated segments inside derived ids (encounters,
# keys, prefixes, asset paths), longest match first; `text` replaces phrases in
# player-visible strings; every other kind is an exact id match.

